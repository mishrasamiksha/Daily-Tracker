services:
  - type: web
    name: daily-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Paste your PostgreSQL connection string here (Supabase / Neon / Render Postgres).
      # The app falls back to a local SQLite file when this is not set.
      - key: DATABASE_URL
        sync: false
