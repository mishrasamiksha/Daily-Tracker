<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Daily Goals Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --green:   #22c55e;
      --red:     #ef4444;
      --yellow:  #f59e0b;
      --accent:  #6366f1;
      --accent2: #818cf8;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-link {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity .2s;
    }
    .btn-link:hover { opacity: .85; }

    .container { max-width: 1060px; margin: 0 auto; padding: 32px 20px; }

    /* ── Stat cards row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 18px;
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent2);
      line-height: 1.1;
    }
    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Charts row ── */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 32px;
    }
    @media (max-width: 720px) { .charts-row { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px;
    }
    .chart-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── History table ── */
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: auto;
      max-height: 420px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead th {
      background: #212435;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tbody tr { border-top: 1px solid var(--border); }
    tbody tr:hover { background: rgba(255,255,255,.03); }
    tbody td {
      padding: 11px 14px;
      color: var(--text);
      white-space: nowrap;
    }
    .score-cell {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .score-cell.great { color: var(--green); }
    .score-cell.ok    { color: var(--yellow); }
    .score-cell.poor  { color: var(--red); }

    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .dot.pass { background: var(--green); }
    .dot.fail { background: var(--red); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 1rem;
    }
    .empty-state a { color: var(--accent2); }

    /* ── Calendar ── */
    .cal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 14px;
      margin-top: 28px;
      max-width: 500px;
      position: relative;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .cal-nav {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 30px; height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-nav:hover { background: var(--accent); }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-day-name {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0 8px;
      text-transform: uppercase;
    }
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: default;
      border: 1.5px solid transparent;
      transition: border-color .15s;
      text-decoration: none;
      color: var(--text);
    }
    .cal-cell.empty  { background: transparent; cursor: default; }
    .cal-cell.future { color: #3a3d50; background: transparent; }
    .cal-cell.recorded {
      background: #052e16;
      border-color: var(--green);
      color: var(--green);
      cursor: pointer;
    }
    .cal-cell.recorded:hover {
      background: #064e23;
      border-color: #4ade80;
    }
    .cal-cell.unrecorded {
      background: var(--surface);
      border-color: var(--border);
      color: var(--muted);
    }
    .cal-cell.unrecorded:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: rgba(99,102,241,.1);
    }
    .cal-cell.today-cell {
      border-color: var(--accent) !important;
      color: var(--accent2) !important;
    }
    .cal-check { font-size: 0.75rem; }

    /* ── Calendar popup ── */
    .cal-popup {
      position: absolute;
      background: #1e2130;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.55);
      z-index: 200;
      min-width: 150px;
    }
    .cal-popup-date {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: .04em;
    }
    .cal-popup-btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      margin-top: 5px;
      text-align: center;
      border: none;
      box-sizing: border-box;
    }
    .cal-popup-btn.edit-btn  { background: rgba(99,102,241,.2); color: var(--accent2); }
    .cal-popup-btn.edit-btn:hover  { background: var(--accent); color: #fff; }
    .cal-popup-btn.delete-btn { background: rgba(239,68,68,.15); color: var(--red); }
    .cal-popup-btn.delete-btn:hover { background: var(--red); color: #fff; }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .row-limit-label { font-size: 0.78rem; color: var(--muted); margin-right: 8px; }
    .row-limit-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .row-limit-select:focus { outline: none; border-color: var(--accent); }

    .btn-delete {
      background: none;
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: 5px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 0.78rem;
      line-height: 1.4;
      transition: background .15s, color .15s;
    }
    .btn-delete:hover { background: var(--red); color: #fff; }
    .btn-delete:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>

<header class="header">
  <h1>&#9733; Dashboard</h1>
  <a class="btn-link" href="/">&#43; Today's Check-in</a>
</header>

<div class="container">

{% if history %}

  <!-- ── Stats ── -->
  <div class="stats-row" id="stats-row"></div>

  <!-- ── Charts ── -->
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Daily Score Trend (%)</div>
      <canvas id="trendChart" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Habit Success Rate</div>
      <canvas id="habitChart"></canvas>
    </div>
  </div>

  <!-- ── History Table ── -->
  <div class="section-header-row">
    <p class="section-title" style="margin:0">Entry History (latest first)</p>
    <div>
      <label class="row-limit-label">Show:</label>
      <select id="row-limit" class="row-limit-select">
        <option value="10">Top 10</option>
        <option value="20" selected>Top 20</option>
        <option value="30">Top 30</option>
        <option value="0">All</option>
      </select>
    </div>
  </div>
  <div class="table-wrap">
    <table id="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Score</th>
          {% for q in questions %}
          <th>{{ q.label }}</th>
          {% endfor %}
          <th></th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="50" style="text-align:center;color:var(--muted);padding:20px">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ── Calendar ── -->
  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">&#8249;</button>
      <span class="cal-title" id="cal-month-label"></span>
      <button class="cal-nav" id="cal-next">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <!-- popup shown on clicking a recorded date -->
    <div id="cal-popup" class="cal-popup" style="display:none">
      <div class="cal-popup-date"></div>
      <a class="cal-popup-btn edit-btn" href="#">✏ Edit</a>
      <button class="cal-popup-btn delete-btn">🗑 Delete</button>
    </div>
  </div>

{% else %}
  <div class="empty-state">
    <p>No data yet. <a href="/">Complete your first check-in!</a></p>
  </div>
{% endif %}

</div>

{% if history %}
<script>
  const questions = {{ questions | tojson }};
  let recordedDates = new Set({{ recorded_dates | tojson }});
  let latestHistory = [];

  // ── Calendar ──
  const today = new Date();
  let calYear  = today.getFullYear();
  let calMonth = today.getMonth();

  function pad(n) { return String(n).padStart(2, '0'); }
  function toYMD(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

  function renderCalendar() {
    const label = new Date(calYear, calMonth, 1)
      .toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    document.getElementById('cal-month-label').textContent = label;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    // Day headers
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
      grid.innerHTML += `<div class="cal-day-name">${d}</div>`;
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayYMD = toYMD(today.getFullYear(), today.getMonth(), today.getDate());

    // Empty leading cells
    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="cal-cell empty"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const ymd = toYMD(calYear, calMonth, d);
      const isToday    = ymd === todayYMD;
      const isFuture   = ymd > todayYMD;
      const isRecorded = recordedDates.has(ymd);

      if (isFuture) {
        grid.innerHTML += `<div class="cal-cell future">${d}</div>`;
      } else if (isRecorded) {
        grid.innerHTML += `<div class="cal-cell recorded" onclick="showCalPopup(event,'${ymd}')" title="Click to edit or delete">${d}<span class="cal-check">✓</span></div>`;
      } else {
        const cls = isToday ? 'unrecorded today-cell' : 'unrecorded';
        grid.innerHTML += `<a class="cal-cell ${cls}" href="/?date=${ymd}" title="Log entry for ${ymd}">${d}<span class="cal-check">+</span></a>`;
      }
    }
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    // Don’t go beyond the current month
    const now = new Date();
    if (calYear < now.getFullYear() || (calYear === now.getFullYear() && calMonth < now.getMonth())) {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }
  });
  renderCalendar();

  // ── Calendar popup ──
  function showCalPopup(event, dateStr) {
    event.stopPropagation();
    const popup = document.getElementById('cal-popup');
    popup.querySelector('.cal-popup-date').textContent = dateStr;
    popup.querySelector('.edit-btn').href = `/?date=${dateStr}`;

    const deleteBtn = popup.querySelector('.delete-btn');
    deleteBtn.onclick = function(e) {
      e.stopPropagation();
      popup.style.display = 'none';
      if (!confirm(`Delete the entry for ${dateStr}?\nThis cannot be undone.`)) return;
      fetch(`/api/delete/${dateStr}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
          if (data.ok) window.location.reload();
          else alert('Delete failed: ' + (data.error || 'unknown error'));
        })
        .catch(() => alert('Delete failed. Please try again.'));
    };

    const cell = event.currentTarget;
    const calCard = document.querySelector('.cal-card');
    const cellRect = cell.getBoundingClientRect();
    const calRect  = calCard.getBoundingClientRect();

    popup.style.display = 'block';
    let top  = cellRect.bottom - calRect.top + 4;
    let left = cellRect.left  - calRect.left;
    const pw = popup.offsetWidth;
    if (left + pw > calRect.width) left = calRect.width - pw - 4;
    popup.style.top  = top + 'px';
    popup.style.left = Math.max(0, left) + 'px';
  }

  document.addEventListener('click', () => {
    const p = document.getElementById('cal-popup');
    if (p) p.style.display = 'none';
  });

  // ── Render history table ──
  function renderTable(history) {
    const limit = parseInt(document.getElementById('row-limit').value);
    const rows = limit > 0 ? [...history].reverse().slice(0, limit) : [...history].reverse();
    const tbody = document.getElementById('history-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="${questions.length + 2}" style="text-align:center;color:var(--muted);padding:20px">No entries yet</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const pct = parseFloat(r.score_pct) || 0;
      const cls = pct >= 75 ? 'great' : pct >= 50 ? 'ok' : 'poor';
      const habits = questions.map(q => {
        const passed = r[q.id] === q.expected;
        return `<td><span class="dot ${passed ? 'pass' : 'fail'}" title="${r[q.id] || ''}"></span></td>`;
      }).join('');
      return `<tr><td>${r.date}</td><td class="score-cell ${cls}">${pct.toFixed(1)}%</td>${habits}<td><button class="btn-delete" onclick="deleteEntry('${r.date}',this)" title="Delete entry for ${r.date}">🗑</button></td></tr>`;
    }).join('');
  }

  function deleteEntry(dateStr, btn) {
    if (!confirm(`Delete the entry for ${dateStr}?\nThis cannot be undone.`)) return;
    btn.disabled = true;
    btn.textContent = '…';
    fetch(`/api/delete/${dateStr}`, { method: 'DELETE' })
      .then(r => r.json())
      .then(data => {
        if (data.ok) { window.location.reload(); }
        else { alert('Delete failed: ' + (data.error || 'unknown error')); btn.disabled = false; btn.textContent = '🗑'; }
      })
      .catch(() => { alert('Delete failed. Please try again.'); btn.disabled = false; btn.textContent = '🗑'; });
  }

  document.getElementById('row-limit').addEventListener('change', () => renderTable(latestHistory));

  // ── Fetch fresh history → update stats + charts + calendar ──
  fetch('/api/history')
    .then(res => res.json())
    .then(history => {
      latestHistory = history;
      recordedDates = new Set(history.map(r => r.date));
      renderCalendar();
      renderTable(history);

      const scores = history.map(r => parseFloat(r.score_pct) || 0);
      if (!scores.length) return;

      const avg = scores.reduce((a,b) => a+b, 0) / scores.length;
      const best = Math.max(...scores);
      const streak = (() => {
        const todayYMD = toYMD(today.getFullYear(), today.getMonth(), today.getDate());
        let s = 0;
        for (let i = history.length - 1; i >= 0; i--) {
          const score = parseFloat(history[i].score_pct) || 0;
          if (history[i].date === todayYMD && score < 75) continue; // skip incomplete today
          if (score >= 75) s++; else break;
        }
        return s;
      })();
      const statsRow = document.getElementById("stats-row");
      statsRow.innerHTML = '';
      [
        { v: history.length, l: "Days Tracked" },
        { v: avg.toFixed(1) + "%", l: "Average Score" },
        { v: best.toFixed(1) + "%", l: "Best Score" },
        { v: streak + (streak === 1 ? " day" : " days"), l: "Current Streak (≥75%)" },
      ].forEach(({ v, l }) => {
        statsRow.innerHTML += `<div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`;
      });

      const labels = history.map(r => r.date);
      new Chart(document.getElementById("trendChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Score %",
            data: scores,
            borderColor: "#6366f1",
            backgroundColor: "rgba(99,102,241,.12)",
            borderWidth: 2,
            pointBackgroundColor: scores.map(s => s >= 75 ? "#22c55e" : s >= 50 ? "#f59e0b" : "#ef4444"),
            pointRadius: 5,
            fill: true,
            tension: 0.35,
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8892a4", maxTicksLimit: 10 }, grid: { color: "#2a2d3e" } },
            y: { ticks: { color: "#8892a4", callback: v => v + "%" }, grid: { color: "#2a2d3e" }, min: 0, max: 100 }
          }
        }
      });

      const habitRates = questions.map(q => {
        const met = history.filter(r => r[q.id] === q.expected).length;
        return Math.round((met / history.length) * 100);
      });
      new Chart(document.getElementById("habitChart"), {
        type: "bar",
        data: {
          labels: questions.map(q => q.label),
          datasets: [{
            data: habitRates,
            backgroundColor: habitRates.map(r => r >= 75 ? "rgba(34,197,94,.7)" : r >= 50 ? "rgba(245,158,11,.7)" : "rgba(239,68,68,.7)"),
            borderRadius: 5,
          }]
        },
        options: {
          indexAxis: "y",
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8892a4", callback: v => v + "%" }, grid: { color: "#2a2d3e" }, min: 0, max: 100 },
            y: { ticks: { color: "#8892a4", font: { size: 11 } }, grid: { display: false } }
          }
        }
      });
    });
</script>
{% endif %}

</body>
</html>
